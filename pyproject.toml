[project]
name = "plan2bim"
dynamic = ["version"]
description = "Floor plan drawings (DWG or DXF) -> 3D building model (IFC file and web viewer)"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "ezdxf>=1.4",       # read DXF geometry, layers, block attributes
    "shapely>=2.0",     # all plan geometry: the cells that the drawn lines enclose, outlines, cuts
    "ifcopenshell>=0.8", # write the IFC file, read it back with another geometry kernel, validate it
    "matplotlib>=3.11.2",   # review plots
    "scipy>=1.18.1",        # nearest-point search between line end points
    "manifold3d>=3.5.5",    # join prisms into closed solids, find solids that overlap
]

[project.scripts]
plan2bim = "plan2bim.cli:main"

[project.optional-dependencies]
web = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",    # the test client of the web service
    "plan2bim[web]",     # the tests run the web service
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "plan2bim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["plan2bim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
